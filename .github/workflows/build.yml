name: Build BOYKA CLIENT

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalacja Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Sprawdzenie wersji Gradle
        run: gradle --version

      - name: Budowanie moda
        run: gradle build --no-daemon

      - name: Prześlij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: BOYKA-CLIENT-1.21.4
          path: build/libs/*.jar
